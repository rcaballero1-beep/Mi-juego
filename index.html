<head>
    <meta charset="UTF-8">

    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Outfit', sans-serif;
            background: #0b132b;
            color: #ffffff;
            min-height: 100vh;
            user-select: none;
            overflow-x: hidden;
        }

        h1, h2, h3, .font-fun {
            font-family: 'Fredoka', cursive;
        }

        /* GLOW & NEON EFFECTS */
        .neon-glow-cyan {
            box-shadow: 0 0 25px rgba(6, 182, 212, 0.6), inset 0 0 15px rgba(6, 182, 212, 0.4);
        }

        .neon-glow-amber {
            box-shadow: 0 0 25px rgba(245, 158, 11, 0.7), inset 0 0 15px rgba(245, 158, 11, 0.4);
        }

        /* HOTSPOTS FLOTANTES EN LA IMAGEN */
        .hotspot {
            position: absolute;
            transform: translate(-50%, -50%);
            cursor: pointer;
            z-index: 30;
            transition: all 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }

        .hotspot:hover {
            transform: translate(-50%, -50%) scale(1.25);
        }

        /* SPEECH BUBBLE DETECTIVES */
        .detective-speech {
            position: relative;
            background: rgba(15, 23, 42, 0.95);
            border: 3px solid #38bdf8;
            box-shadow: 0 10px 30px rgba(0,0,0,0.8), 0 0 15px rgba(56, 189, 248, 0.3);
            border-radius: 20px;
        }

        /* BOTONES CON EFECTO TÁCTIL Y SOMBRA 3D */
        .btn-detective {
            transition: all 0.15s ease;
            box-shadow: 0 6px 0 var(--tw-shadow-color, #0284c7), 0 10px 15px rgba(0,0,0,0.5);
        }
        .btn-detective:active {
            transform: translateY(4px);
            box-shadow: 0 2px 0 var(--tw-shadow-color, #0284c7), 0 4px 6px rgba(0,0,0,0.5);
        }

        /* ANIMACIÓN DE HUELLAS CIAN FLOTANTES */
        @keyframes footprint-pulse {
            0%, 100% { opacity: 0.4; transform: scale(1); filter: drop-shadow(0 0 5px #06b6d4); }
            50% { opacity: 1; transform: scale(1.1); filter: drop-shadow(0 0 15px #22d3ee); }
        }
        .animate-footprint {
            animation: footprint-pulse 2s infinite ease-in-out;
        }

        /* TRANSICIONES DE ESCENARIO */
        .fade-enter {
            animation: fadeIn 0.4s ease-out forwards;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
    </style>
</head>

    <!-- EFECTOS DE SONIDO WEB AUDIO API -->
    <script>
        class DetectiveAudioSystem {
            constructor() {
                this.ctx = null;
                this.muted = false;
            }
            init() {
                if (!this.ctx) {
                    this.ctx = new (window.AudioContext || window.webkitAudioContext)();
                }
            }
            playFlashlight() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sine';
                osc.frequency.setValueAtTime(300, now);
                osc.frequency.exponentialRampToValueAtTime(800, now + 0.15);
                gain.gain.setValueAtTime(0.3, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.15);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.15);
            }
            playCorrect() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                [523.25, 659.25, 783.99, 1046.50].forEach((f, i) => {
                    const osc = this.ctx.createOscillator();
                    const gain = this.ctx.createGain();
                    const st = now + i * 0.08;
                    osc.type = 'triangle';
                    osc.frequency.setValueAtTime(f, st);
                    gain.gain.setValueAtTime(0.2, st);
                    gain.gain.exponentialRampToValueAtTime(0.01, st + 0.2);
                    osc.connect(gain);
                    gain.connect(this.ctx.destination);
                    osc.start(st);
                    osc.stop(st + 0.2);
                });
            }
            playWrong() {
                if (this.muted) return;
                this.init();
                const now = this.ctx.currentTime;
                const osc = this.ctx.createOscillator();
                const gain = this.ctx.createGain();
                osc.type = 'sawtooth';
                osc.frequency.setValueAtTime(200, now);
                osc.frequency.linearRampToValueAtTime(100, now + 0.3);
                gain.gain.setValueAtTime(0.25, now);
                gain.gain.exponentialRampToValueAtTime(0.01, now + 0.3);
                osc.connect(gain);
                gain.connect(this.ctx.destination);
                osc.start(now);
                osc.stop(now + 0.3);
            }
        }
        const audioSys = new DetectiveAudioSystem();
        function toggleAudio() {
            audioSys.muted = !audioSys.muted;
            document.getElementById('btn-sound').innerText = audioSys.muted ? '🔇' : '🔊';
        }
    </script>

    <!-- FUEGOS ARTIFICIALES / CONFETI -->
    <script>
        const canvas = document.getElementById('fx-canvas');
        const ctx = canvas.getContext('2d');
        let particles = [];
        function resizeCanvas() {
            canvas.width = window.innerWidth;
            canvas.height = window.innerHeight;
        }
        window.addEventListener('resize', resizeCanvas);
        resizeCanvas();

        function launchFX() {
            const colors = ['#38bdf8', '#facc15', '#a855f7', '#4ade80', '#f43f5e'];
            for (let i = 0; i < 60; i++) {
                particles.push({
                    x: canvas.width / 2,
                    y: canvas.height / 2,
                    vx: (Math.random() - 0.5) * 16,
                    vy: (Math.random() - 0.5) * 16,
                    color: colors[Math.floor(Math.random() * colors.length)],
                    size: Math.random() * 8 + 3,
                    alpha: 1
                });
            }
            animFX();
            audioSys.playCorrect();
        }

        function animFX() {
            ctx.clearRect(0, 0, canvas.width, canvas.height);
            particles.forEach((p, index) => {
                p.x += p.vx;
                p.y += p.vy;
                p.alpha -= 0.02;
                if (p.alpha <= 0) {
                    particles.splice(index, 1);
                } else {
                    ctx.save();
                    ctx.globalAlpha = p.alpha;
                    ctx.fillStyle = p.color;
                    ctx.beginPath();
                    ctx.arc(p.x, p.y, p.size, 0, Math.PI * 2);
                    ctx.fill();
                    ctx.restore();
                }
            });
            if (particles.length > 0) requestAnimationFrame(animFX);
        }
    </script>

            `;
            showStageHTML(html);
            document.getElementById('footer-text').innerText = " Selecciona la respuesta correcta para avanzar por el mapa nocturno.";
        }

        function checkAnswer(selectedIndex) {
            const q = QUESTS[gameState.currentQuestion];
            const isCorrect = q.options[selectedIndex].correct;

            q.options.forEach((_, i) => {
                const btn = document.getElementById(`opt-btn-${i}`);
                btn.onclick = null;
                if (i === selectedIndex) {
                    if (isCorrect) {
                        btn.className = "btn-detective text-left p-4 rounded-2xl bg-emerald-600 border-2 border-white text-white font-bold text-sm md:text-base flex items-center justify-between shadow-emerald-900";
                    } else {
                        btn.className = "btn-detective text-left p-4 rounded-2xl bg-rose-600 border-2 border-white text-white font-bold text-sm md:text-base flex items-center justify-between shadow-rose-900";
                    }
                }
            });

            if (isCorrect) {
                launchFX();
                gameState.score += 300;
                updateHeaderUI();
                document.getElementById('footer-text').innerHTML = `<span class="text-emerald-400 font-bold">¡CORRECTO! +300 pts. ${q.explanation}</span>`;
            } else {
                audioSys.playWrong();
                gameState.lives--;
                updateHeaderUI();
                document.getElementById('footer-text').innerHTML = `<span class="text-rose-400 font-bold">¡PISTA INCORRECTA! Se restó 1 lupa de vida.</span>`;
            }

            const btnNext = document.getElementById('btn-action-next');
            btnNext.classList.remove('hidden');
            btnNext.onclick = () => {
                btnNext.classList.add('hidden');
                if (gameState.lives <= 0) {
                    renderGameOver();
                } else if (gameState.currentQuestion + 1 < QUESTS.length) {
                    startChallenge(gameState.currentQuestion + 1);
                } else {
                    renderFlashlightExamScreen();
                }
            };
        }

        // PANTALLA 3: EXAMEN CIENTÍFICO CON LA LINTERNA EN VIVO
        function renderFlashlightExamScreen() {
            document.getElementById('case-title').innerText = "EXAMEN DE LINTERNA CIENTÍFICA";
            document.getElementById('detective-step').innerText = "Paso Final: Ilumina los elementos fotosintéticos";

            gameState.flashlightExamSelected = [];

            const html = `
                <div class="w-full max-w-3xl bg-slate-900/90 border-2 border-purple-500 rounded-3xl p-6 flex flex-col items-center text-center fade-enter">
                    
                    <div class="w-16 h-16 rounded-full bg-purple-950 border-2 border-purple-400 flex items-center justify-center text-3xl mb-3">
                        🔦
                    </div>

                    <h2 class="text-2xl font-bold font-fun text-amber-300 mb-2">
                        Examen de Mateo: Ilumina con tu linterna los 2 componentes esenciales que necesitan las plantas para vivir
                    </h2>
                    <p class="text-xs text-slate-300 mb-6">Haz clic sobre las tarjetas para iluminarlas con la linterna:</p>

                    <div class="grid grid-cols-1 sm:grid-cols-3 gap-4 w-full mb-6">
                        <div id="card-0" onclick="toggleExamCard(0)" class="btn-detective bg-slate-800 border-2 border-cyan-500/40 p-5 rounded-2xl cursor-pointer flex flex-col items-center">
                            <span class="text-3xl mb-2">☀️</span>
                            <span class="font-bold text-sm font-fun">Luz Solar</span>
                        </div>
                        <div id="card-1" onclick="toggleExamCard(1)" class="btn-detective bg-slate-800 border-2 border-cyan-500/40 p-5 rounded-2xl cursor-pointer flex flex-col items-center">
                            <span class="text-3xl mb-2">💧</span>
                            <span class="font-bold text-sm font-fun">Agua (H2O)</span>
                        </div>
                        <div id="card-2" onclick="toggleExamCard(2)" class="btn-detective bg-slate-800 border-2 border-cyan-500/40 p-5 rounded-2xl cursor-pointer flex flex-col items-center">
                            <span class="text-3xl mb-2">🍕</span>
                            <span class="font-bold text-sm font-fun">Pizza Chatarra</span>
                        </div>
                    </div>

                    <button onclick="checkExamAnswer()" class="btn-detective bg-gradient-to-r from-amber-400 to-yellow-500 text-slate-950 font-fun font-bold px-8 py-3 rounded-2xl text-lg uppercase shadow-amber-800">
                        ¡Comprobar con la Linterna! 🔦
                    </button>
                </div>
            `;
            showStageHTML(html);
        }

        function toggleExamCard(idx) {
            audioSys.playFlashlight();
            const card = document.getElementById(`card-${idx}`);
            const pos = gameState.flashlightExamSelected.indexOf(idx);

            if (pos > -1) {
                gameState.flashlightExamSelected.splice(pos, 1);
                card.className = "btn-detective bg-slate-800 border-2 border-cyan-500/40 p-5 rounded-2xl cursor-pointer flex flex-col items-center";
            } else {
                if (gameState.flashlightExamSelected.length >= 2) return;
                gameState.flashlightExamSelected.push(idx);
                card.className = "btn-detective bg-amber-400 text-slate-950 border-2 border-white p-5 rounded-2xl cursor-pointer flex flex-col items-center font-bold scale-105";
            }
        }

        function checkExamAnswer() {
            if (gameState.flashlightExamSelected.length < 2) {
                alert("¡Ilumina 2 elementos con la linterna primero!");
                return;
            }

            const isCorrect = gameState.flashlightExamSelected.includes(0) && gameState.flashlightExamSelected.includes(1);

            if (isCorrect) {
                launchFX();
                gameState.score += 400;
                updateHeaderUI();
                renderVictoryScreen();
            } else {
                audioSys.playWrong();
                gameState.lives--;
                updateHeaderUI();
                if (gameState.lives <= 0) renderGameOver();
                else alert("Pista errónea. La pizza no alimenta fotosintéticamente a las plantas. Intenta de nuevo.");
            }
        }

        // PANTALLA DE VICTORIA CON CERTIFICADO
        function renderVictoryScreen() {
            launchFX();
            document.getElementById('case-title').innerText = "¡MISTERIO MUNICIPAL RESUELTO!";
            document.getElementById('detective-step').innerText = "Diploma de Detective Científico";

            const html = `
                <div class="w-full max-w-2xl bg-gradient-to-b from-slate-900 via-indigo-950 to-slate-900 border-4 border-amber-400 rounded-3xl p-6 text-center flex flex-col items-center fade-enter shadow-[0_0_60px_rgba(245,158,11,0.4)]">
                    
                    <span class="bg-amber-400 text-slate-950 font-black px-4 py-1 rounded-full text-xs uppercase tracking-widest font-fun mb-2">
                        🏆 MÁXIMO LOGRO DETECTIVE
                    </span>

                    <h1 class="text-3xl md:text-5xl font-black font-fun text-transparent bg-clip-text bg-gradient-to-r from-amber-300 via-yellow-200 to-amber-400 mb-2">
                        ¡FELICIDADES DETECTIVE!
                    </h1>
                    <p class="text-xs md:text-sm text-cyan-200 mb-6">
                        Junto a Lucas, Valeria y Mateo descifraste los enigmas de las huellas, la fotosíntesis y el mapa nocturno.
                    </p>

                    <div class="w-full bg-slate-950/80 border-2 border-cyan-400/50 rounded-2xl p-4 mb-6 flex justify-around items-center">
                        <div>
                            <span class="text-xs text-cyan-400 font-bold uppercase block">Puntuación Final</span>
                            <span class="text-3xl font-black font-fun text-amber-300">${gameState.score} pts</span>
                        </div>
                        <div class="h-10 w-0.5 bg-slate-800"></div>
                        <div>
                            <span class="text-xs text-cyan-400 font-bold uppercase block">Rango Otorgado</span>
                            <span class="text-xl font-bold font-fun text-emerald-300">Maestro de Ciencias 🕵️‍♂️</span>
                        </div>
                    </div>

                    <button onclick="resetGame()" class="btn-detective bg-amber-400 hover:bg-amber-300 text-slate-950 font-fun font-bold text-xl px-10 py-3.5 rounded-2xl shadow-amber-800 uppercase">
                        🔄 Jugar de Nuevo
                    </button>
                </div>
            `;
            showStageHTML(html);
        }

        // GAME OVER
        function renderGameOver() {
            const html = `
                <div class="w-full max-w-md bg-slate-900 border-2 border-rose-500 rounded-3xl p-6 text-center flex flex-col items-center fade-enter">
                    <span class="text-5xl mb-2">🔍</span>
                    <h2 class="text-3xl font-bold font-fun text-rose-400 mb-2">¡Se agotaron las lupas!</h2>
                    <p class="text-xs text-slate-300 mb-6">Los 3 detectives necesitan repasar los cuadernos de ciencias para resolver el caso.</p>
                    <button onclick="resetGame()" class="btn-detective bg-rose-500 text-white font-fun font-bold text-lg px-8 py-3 rounded-2xl shadow-rose-900 uppercase">
                        Reintentar Caso 🔄
                    </button>
                </div>
            `;
            showStageHTML(html);
        }

        function resetGame() {
            gameState.score = 0;
            gameState.lives = 3;
            gameState.dialogueIndex = 0;
            updateHeaderUI();
            renderMainImageScene();
        }

        // CONTROL DE DEMONA / NAV SHOWCASE
        function previewScreen(screenType) {
            audioSys.playFlashlight();
            if (screenType === 'intro' || screenType === 'map') {
                renderMainImageScene();
            } else if (screenType === 'challenge') {
                startChallenge(0);
            } else if (screenType === 'lab') {
                renderFlashlightExamScreen();
            } else if (screenType === 'victory') {
                renderVictoryScreen();
            }
        }

        function handleNextAction() {
            // Manejador del botón dinámico inferior
        }

        window.onload = () => {
            updateHeaderUI();
            renderMainImageScene();
        };
    </script>
</body>
</html>
